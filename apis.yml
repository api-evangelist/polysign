apis:
  - name: AtomicNet API Server
    description: >-
      The node-side REST interface for interacting with an AtomicNet node — registering assets and
      partners, publishing orders and book transfers, requesting and approving escrow and beneficiary
      authorizations, publishing settlements, releasing settlement and book transfer confirmations,
      polling status updates, minting one-time investor identifiers, canonicalization and UID
      utilities, data synchronization, and system health / circuit-breaker checks. Fifty-six
      operations secured with OAuth 2.0 client credentials.
    humanURL: https://docs.polynet.sandbox.polysign.io/
    x-baseurl-note: >-
      The published OpenAPI carries no servers[] block and no public AtomicNet node host resolves in
      DNS — AtomicNet is a participant-deployed network, so the base URL is deployment-specific. All
      paths are rooted at /v1. Recorded rather than guessed.
    tags:
      - digital-assets
      - settlement
      - escrow
      - capital-markets
      - atomicnet
      - blockchain
    properties:
      - type: Documentation
        url: https://docs.polynet.sandbox.polysign.io/
      - type: APIReference
        url: https://docs.polynet.sandbox.polysign.io/
      - type: OpenAPI
        url: openapi/polysign-atomicnet-api-server-openapi.json
      - type: Overlay
        url: overlays/polysign-atomicnet-api-server-overlay.yaml
  - name: AtomicNet Merchant Gate Node
    description: >-
      The merchant-facing gate onto an AtomicNet node: submit an order, submit a book transfer, and
      register assets to the node, alongside the shared authentication and system health surface.
      Eight operations secured with OAuth 2.0 client credentials.
    humanURL: https://docs.polynet.sandbox.polysign.io/merchant-gate.html
    x-baseurl-note: >-
      No servers[] block is published and the node is participant-deployed; all paths are rooted at
      /v1.
    tags:
      - digital-assets
      - payments
      - merchant
      - atomicnet
      - settlement
    properties:
      - type: Documentation
        url: https://docs.polynet.sandbox.polysign.io/merchant-gate.html
      - type: APIReference
        url: https://docs.polynet.sandbox.polysign.io/merchant-gate.html
      - type: OpenAPI
        url: openapi/polysign-merchant-gate-openapi.json
      - type: Overlay
        url: overlays/polysign-merchant-gate-overlay.yaml
  - name: AtomicNet ABC Proxy Service
    description: >-
      Proxy service for the ABC ledger: register an ABC account against an AtomicNet ID, look up
      account information, memorialize a digest and verify that a digest was memorialized, sign a
      digest and verify a signature, and create and faucet accounts on the ABC testnet. Fourteen
      operations secured with OAuth 2.0 client credentials.
    humanURL: https://docs.polynet.sandbox.polysign.io/abc-service.html
    x-baseurl-note: >-
      No servers[] block is published and the node is participant-deployed; all paths are rooted at
      /v1.
    tags:
      - digital-assets
      - blockchain
      - cryptography
      - atomicnet
      - testnet
    properties:
      - type: Documentation
        url: https://docs.polynet.sandbox.polysign.io/abc-service.html
      - type: APIReference
        url: https://docs.polynet.sandbox.polysign.io/abc-service.html
      - type: OpenAPI
        url: openapi/polysign-abc-proxy-service-openapi.json
      - type: Overlay
        url: overlays/polysign-abc-proxy-service-overlay.yaml
