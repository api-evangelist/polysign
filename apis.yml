aid: polysign
name: PolySign
description: >-
  PolySign, Inc. is an Oakland / San Francisco / New York financial technology company building
  blockchain-enabled infrastructure for institutional digital asset capital markets and payments.
  Founded by Arthur Britto, David Schwartz and Jack McDonald, PolySign operates a third-generation
  permissioned blockchain and the AtomicNet settlement network, and was the parent of Standard
  Custody & Trust Company, the NYDFS-regulated digital asset custody, trading and settlement platform
  acquired by Ripple in 2024. PolySign publishes three OpenAPI 3.0.3 contracts for AtomicNet — the
  AtomicNet API Server (node interface for assets, orders, escrow and beneficiary authorizations,
  settlements, settlement confirmations, book transfers, partners and investors), the AtomicNet
  Merchant Gate Node, and the AtomicNet ABC Proxy Service (account registration, digest
  memorialization, signing and testnet faucet) — all authenticated with OAuth 2.0 client credentials
  issued by a PolySign-hosted token endpoint.
